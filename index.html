<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>¿Quieres salir conmigo mi Biooo?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Corazones flotando -->
  <div id="hearts-container"></div>

  <div class="container">
    <h1>¿Quieres salir conmigo mi Biooo? 💖</h1>

    <div class="buttons">
      <button id="yesBtn">Sí 💘</button>
      <button id="noBtn">No</button>
    </div>

    <p id="message"></p>
  </div>

  <!-- Pantalla final -->
  <div id="finalScreen">
    <h1>💖 TE AMOOOO 💖</h1>
    <p>Sabía que dirías que sí 🥰</p>
  </div>

  <!-- Música -->
  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
